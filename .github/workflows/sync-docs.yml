name: Sync Confluence to Markdown

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Confluence Exporter
        run: pip install confluence-markdown-exporter==1.0.24

      - name: Export Confluence to Markdown
        env:
          ATLASSIAN_USERNAME: ${{ secrets.CONFLUENCE_USER }}
          ATLASSIAN_API_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
          ATLASSIAN_URL: "https://geo2.atlassian.net"
        run: |
          confluence-markdown-exporter space BALDEVGEO ./
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'Confluence Sync Bot'
          git config --global user.email 'bot@noreply.github.com'
          
          # Check if there are changes
          if [ -d "./" ]; then
            git add ./
            if ! git diff-index --quiet HEAD; then
              git commit -m "docs: sync from Confluence [skip ci]"
              git push
            else
              echo "No changes to commit."
            fi
          else
             echo "Output directory ./docs was not created. Check exporter logs."
             exit 1
          fi
