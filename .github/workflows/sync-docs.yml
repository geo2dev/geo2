name: Sync Confluence to Markdown

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Confluence Exporter
        run: pip install confluence-markdown-exporter

      - name: Export Confluence to Markdown
        env:
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: |
          USER_ARG="auth.confluence.https://geo2.atlassian.net.username=$CONFLUENCE_USER"
          TOKEN_ARG="auth.confluence.https://geo2.atlassian.net.api_token=$CONFLUENCE_TOKEN"
          
          confluence-markdown-exporter config set "$USER_ARG"
          confluence-markdown-exporter config set "$TOKEN_ARG"
          confluence-markdown-exporter config set "export.output_path=./"
          
          confluence-markdown-exporter spaces "https://geo2.atlassian.net/wiki/spaces/BALDEVGEO
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'Confluence Sync Bot'
          git config --global user.email 'bot@noreply.github.com'
          
          # Check if there are changes
          if [ -d "./" ]; then
            git add ./
            if ! git diff-index --quiet HEAD; then
              git commit -m "docs: sync from Confluence [skip ci]"
              git push
            else
              echo "No changes to commit."
            fi
          else
             echo "Output directory ./docs was not created. Check exporter logs."
             exit 1
          fi
