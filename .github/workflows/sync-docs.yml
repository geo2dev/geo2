name: Sync Confluence to Markdown

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: confluence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Confluence Exporter
        run: pip install confluence-markdown-exporter==5.2.1

      - name: Configure exporter
        env:
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: |
          cme config set auth.confluence.url "https://geo2.atlassian.net"
          cme config set auth.confluence.username "$CONFLUENCE_USER"
          cme config set auth.confluence.api_token "$CONFLUENCE_TOKEN"
          cme config set export.output_path "$RUNNER_TEMP/export"
          # Breadcrumb links and Confluence TOCs are noise on the Docusaurus site
          # (it renders its own breadcrumbs and table of contents)
          cme config set export.page_breadcrumbs false
          cme config set export.include_toc false

      - name: Export Confluence to Markdown
        run: cme space "https://geo2.atlassian.net/wiki/spaces/BALDEVGEO"

      # --delete removes pages that were deleted or renamed in Confluence;
      # plain re-export used to leave stale trees behind (e.g. Documentation/Geo2)
      - name: Mirror export into repo
        run: rsync -a --delete "$RUNNER_TEMP/export/Documentation/" Documentation/

      - name: Commit and Push changes
        run: |
          git config user.name 'Confluence Sync Bot'
          git config user.email 'bot@noreply.github.com'
          git add -A Documentation
          if ! git diff-index --quiet HEAD; then
            git commit -m "docs: sync from Confluence [skip ci]"
            git push
          else
            echo "No changes to commit."
          fi
