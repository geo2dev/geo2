name: Sync Confluence to Markdown

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Confluence Exporter
        run: pip install confluence-markdown-exporter

      - name: Export Confluence to Markdown
        env:
          CONFLUENCE_USER: ${{ secrets.CONFLUENCE_USER }}
          CONFLUENCE_TOKEN: ${{ secrets.CONFLUENCE_TOKEN }}
        run: |
          # Задаємо спільний шлях до конфігу для запису і читання
          export CME_CONFIG_PATH=$(pwd)/cme_config.json
          
          python3 -c "
          import json, os
          config = {
            'auth': {
              'confluence': {
                'https://geo2.atlassian.net': {
                  'username': os.environ['CONFLUENCE_USER'],
                  'api_token': os.environ['CONFLUENCE_TOKEN']
                }
              }
            },
            'export': {
              'output_path': './'
            }
          }
          with open(os.environ['CME_CONFIG_PATH'], 'w') as f:
              json.dump(config, f)
          "
          
          confluence-markdown-exporter spaces "https://geo2.atlassian.net/wiki/spaces/BALDEVGEO"
          
          rm cme_config.json
          
      - name: Commit and Push changes
        run: |
          git config --global user.name 'Confluence Sync Bot'
          git config --global user.email 'bot@noreply.github.com'
          
          # Check if there are changes
          if [ -d "./" ]; then
            git add ./
            if ! git diff-index --quiet HEAD; then
              git commit -m "docs: sync from Confluence [skip ci]"
              git push
            else
              echo "No changes to commit."
            fi
          else
             echo "Output directory ./docs was not created. Check exporter logs."
             exit 1
          fi
