name: Sync Confluence to Markdown

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: confluence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: allows the action to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Confluence Exporter
        run: pip install confluence-markdown-exporter==5.2.1

      - name: Configure exporter
        env:
          # Scoped API token (Bearer auth): cme routes requests through
          # api.atlassian.com, which rejects classic tokens / Basic auth,
          # so the token goes into the `pat` field, not `api_token`.
          CONFLUENCE_SCOPED_TOKEN: ${{ secrets.CONFLUENCE_SCOPED_TOKEN }}
        run: |
          # auth.confluence is a URL-keyed dict, so it has to be set as JSON
          cme config set "auth.confluence={\"https://geo2.atlassian.net\": {\"pat\": \"$CONFLUENCE_SCOPED_TOKEN\"}}"
          # Breadcrumb links and Confluence TOCs are noise on the Docusaurus site
          # (it renders its own breadcrumbs and table of contents)
          cme config set \
            "export.output_path=$RUNNER_TEMP/export" \
            "export.page_breadcrumbs=false" \
            "export.include_toc=false"

      - name: Export Confluence to Markdown
        run: cme space "https://geo2.atlassian.net/wiki/spaces/BALDEVGEO"

      - name: Generate Confluence sidebar order
        env:
          CONFLUENCE_SCOPED_TOKEN: ${{ secrets.CONFLUENCE_SCOPED_TOKEN }}
        run: python scripts/generate-confluence-sidebar-order.py

      # --delete removes pages that were deleted or renamed in Confluence;
      # plain re-export used to leave stale trees behind (e.g. Documentation/Geo2)
      - name: Mirror export into repo
        run: rsync -a --delete "$RUNNER_TEMP/export/Documentation/" Documentation/

      - name: Commit and Push changes
        run: |
          git config user.name 'Confluence Sync Bot'
          git config user.email 'bot@noreply.github.com'
          git add -A Documentation src/sidebarOrder.json
          if ! git diff-index --quiet HEAD; then
            # no [skip ci]: the push must trigger the deploy workflow
            git commit -m "docs: sync from Confluence"
            git push
          else
            echo "No changes to commit."
          fi


