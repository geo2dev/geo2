name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      # Full history: showLastUpdateTime needs real commit dates, a shallow
      # clone makes every page report the same bogus update date.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Builds the TinaCMS editor into static/admin for this PR's branch.
      # Never blocks the docs: without the secrets, or if TinaCloud is down,
      # the site deploys without /admin.
      - name: Build TinaCMS admin
        env:
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
          TINA_SEARCH_TOKEN: ${{ secrets.TINA_SEARCH_TOKEN }}
          TINA_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$TINA_TOKEN" ] || ! yarn tinacms build; then
            echo "::warning::TinaCMS admin was not built; deploying docs without /admin"
          fi
      - run: yarn build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRJ_PRO_BALDEV_GEO2 }}
          projectId: prj-pro-baldev-geo2
          target: help
