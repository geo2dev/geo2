name: Deploy docs to Firebase Hosting

on:
  # Pages CMS commits via its GitHub App, which emits normal push events
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history: showLastUpdateTime needs real commit dates, a shallow
      # clone makes every page report the same bogus update date.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRJ_PRO_BALDEV_GEO2 }}
          projectId: prj-pro-baldev-geo2
          target: help
          channelId: live
